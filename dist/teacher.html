<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이어지는 마을 · 교사 운영실</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="school.css"><link rel="stylesheet" href="mission.css"></head><body><header><a class="brand" href="./">🌱 이어지는 마을</a><b>교사 운영실</b></header><main class="teacher-main"><section id="teacherLogin" class="teacher-card"><h2>학급 운영 시작</h2><div class="teacher-grid"><label>학급 코드<input id="teacherRoom" autocomplete="off"></label><label>교사 입장 코드<input id="teacherCode" type="password" autocomplete="off"></label><button id="joinTeacher" class="primary">교사로 입장</button></div><p id="teacherError" class="school-error" role="status"></p><details><summary>새 학급 만들기</summary><p>교사 개설키가 필요합니다. 생성된 학생 코드는 CSV로 내려받아 학생별로 배부하세요.</p><div class="teacher-grid"><label>교사 개설키<input id="setupKey" type="password" autocomplete="off"></label><label>학생 수 (최대 120명)<input id="classSize" type="number" min="1" max="120" value="120"></label><button id="createClass" class="primary">학급 만들기</button></div></details></section><section id="newCodes" class="teacher-card" hidden></section><section id="teacherDashboard" hidden><section class="teacher-card"><div class="teacher-row"><h2 id="roomTitle"></h2><button id="teacherRefresh">새로 확인</button><button id="teacherLogout">나가기</button></div><div id="teacherSummary" class="teacher-summary"></div></section><section class="teacher-card" id="teacherStory"></section><section class="teacher-card"><h2>수업 운영</h2><div class="teacher-grid"><label>현재 날짜<input id="roomDay" type="number" min="1" max="365"></label><label>날씨·경제 상황<select id="roomWeather"><option value="0">맑음 · 기준 시세</option><option value="1">축제 · 수요 증가</option><option value="2">맑은 장날</option><option value="3">폭우 · 배송 지연</option><option value="4">비 갠 뒤</option><option value="5">풍작 · 공급 증가</option></select></label><label>시즌<select id="roomPhase"><option>개인 성장</option><option>협력</option></select></label><label>장터<select id="roomMarket"><option value="0">닫기</option><option value="1">열기</option></select></label><label>수업 상태<select id="roomPaused"><option value="0">진행</option><option value="1">일시정지</option></select></label><button id="saveRoom" class="primary">학급 전체에 적용</button></div><p id="teacherStatus" role="status"></p><p>학생 화면은 약 15초 이내 갱신됩니다. 일시정지는 서버에서 즉시 적용됩니다.</p></section><section class="teacher-card"><h2>참여 현황</h2><div id="teacherRoster" class="teacher-table"></div><button id="exportProgress">활동 현황 CSV 저장</button></section><section class="teacher-card"><h2>수업 전 확인</h2><p>① 서로 다른 기기 2대에서 학생 입장 → ② 장터를 열고 실제 교환 → ③ 일시정지 확인 → ④ 새로고침 후 재고 복구 확인.</p><p>접속 표시 기준은 최근 40초 내 통신입니다. 학생 이름은 번호로 표시하며, 입장 코드는 다른 학생에게 공개하지 마세요.</p></section></section></main><script src="teacher.js"></script></body></html>
